# Checks every push to main and every pull request: the workflows themselves, the web
# interface, formatting, clippy, and the tests on Linux (SQLite, Postgres, S3, the reference
# server and DIMSE interoperability) and on Windows. A job runs only when the change touches
# what it checks (scripts/ci-changes.sh): documentation alone runs none of the builds.
# GitHub's own runners only: this repository is public, so it never gets a self-hosted runner.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit a push started from, to compare with
      - name: The filter's own tests
        run: bash scripts/test-ci-changes.sh
      # A pull request is checked out as its merge into the base, whose first parent is the
      # base. A push to main is compared with where main was. Anything else runs every job.
      - id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/paths"
            bash scripts/ci-changes.sh < "$RUNNER_TEMP/paths" | tee -a "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] &&
            git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/paths"
            bash scripts/ci-changes.sh < "$RUNNER_TEMP/paths" | tee -a "$GITHUB_OUTPUT"
          else
            bash scripts/ci-changes.sh --all | tee -a "$GITHUB_OUTPUT"
          fi

  # actionlint (with shellcheck on the scripts inside) over every workflow. Its list of
  # GitHub's runners is older than Ubuntu 26.04, so that one message is ignored; drop the
  # -ignore once an actionlint release knows the labels.
  workflows:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # of actionlint_1.7.12_linux_amd64.tar.gz, from the release's own digest
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO --output-dir "$RUNNER_TEMP" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
          (cd "$RUNNER_TEMP" && echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -ignore 'label "ubuntu-26\.04(-arm)?" is unknown'

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-linux:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      PACS_TEST_POSTGRES_URL: postgres://postgres:test@127.0.0.1:15432
      PACS_TEST_S3_ENDPOINT: http://127.0.0.1:18333
      PACS_TEST_REFERENCE_URL: http://127.0.0.1:18042/dicom-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Started by hand, not as service containers: SeaweedFS needs a command line.
      - name: Postgres, S3 and the reference server
        run: |
          docker run -d --name pg -p 127.0.0.1:15432:5432 -e POSTGRES_PASSWORD=test postgres:18.6-alpine
          docker run -d --name s3 -p 127.0.0.1:18333:8333 chrislusf/seaweedfs:4.48 server -s3
          docker run -d --name ref -p 127.0.0.1:18042:8042 \
            -e DICOM_WEB_PLUGIN_ENABLED=true -e ORTHANC__AUTHENTICATION_ENABLED=false \
            orthancteam/orthanc:26.9.1
          ready() { for _ in $(seq 1 60); do "$@" && return 0; sleep 2; done; echo "::error::not ready: $*"; return 1; }
          ready docker exec pg pg_isready -U postgres -q
          ready curl -fsS -o /dev/null http://127.0.0.1:18042/system
          # the bucket the S3 tests use
          ready curl -fsS -o /dev/null -X PUT http://127.0.0.1:18333/pacs-test

      - name: DCMTK and pynetdicom (DIMSE interoperability)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dcmtk
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q pynetdicom
          echo "PACS_TEST_PYTHON=$RUNNER_TEMP/py/bin/python" >> "$GITHUB_ENV"

      - run: cargo test --workspace --locked
      - run: cargo test -p pacs-dimse --test interop --locked -- --ignored

      - name: Container logs
        if: failure()
        run: for c in pg s3 ref; do echo "== $c"; docker logs --tail 50 "$c"; done

  test-windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      # CharLS must use the same static C runtime (see the file).
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/cmake/msvc-static-crt.cmake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

