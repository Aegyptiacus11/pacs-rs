# Checks every push to main and every pull request: the workflows themselves, the web
# interface, formatting, clippy, and the tests on Linux (SQLite, Postgres, S3, the reference
# server and DIMSE interoperability) and on Windows. A job runs only when the change touches
# what it checks (scripts/ci-changes.sh): documentation alone runs none of the builds.
# release.yml calls this workflow too, and publishes nothing unless it passes; called so, every
# job runs.
# GitHub's own runners only: this repository is public, so it never gets a self-hosted runner.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request cancels the run of the older one. Nothing else is ever
# cancelled: a push to main or a release has a group of its own (its commit), so a code change
# is tested even when a documentation change, whose run skips the tests, follows it at once.
# github.workflow is the caller's name when release.yml calls this.
concurrency:
  group: ${{ github.workflow }}-tests-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit a push started from, to compare with
      - name: The filter's own tests
        run: bash scripts/test-ci-changes.sh
      # A pull request is checked out as its merge into the base, whose first parent is the
      # base. A push to main is compared with where main was. Anything else (a tag or a manual
      # run of release.yml) runs every job.
      - id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/paths"
            bash scripts/ci-changes.sh < "$RUNNER_TEMP/paths" | tee -a "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] &&
            git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/paths"
            bash scripts/ci-changes.sh < "$RUNNER_TEMP/paths" | tee -a "$GITHUB_OUTPUT"
          else
            bash scripts/ci-changes.sh --all | tee -a "$GITHUB_OUTPUT"
          fi

  # actionlint (with shellcheck on the scripts inside) over every workflow. Its list of
  # GitHub's runners is older than Ubuntu 26.04, so that one message is ignored; drop the
  # -ignore once an actionlint release knows the labels.
  workflows:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # of actionlint_1.7.12_linux_amd64.tar.gz, from the release's own digest
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO --output-dir "$RUNNER_TEMP" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
          (cd "$RUNNER_TEMP" && echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -ignore 'label "ubuntu-26\.04(-arm)?" is unknown'

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-linux:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      PACS_TEST_POSTGRES_URL: postgres://postgres:test@127.0.0.1:15432
      PACS_TEST_S3_ENDPOINT: http://127.0.0.1:18333
      PACS_TEST_REFERENCE_URL: http://127.0.0.1:18042/dicom-web
      # an OpenID provider, for the sign-in and the tools' tokens (tests/oidc_rauthy.rs)
      PACS_TEST_RAUTHY_URL: http://localhost:18088/auth/v1/
      # audit messages are validated against DICOM's schema
      PACS_TEST_XMLLINT: xmllint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Started by hand, not as service containers: SeaweedFS needs a command line.
      - name: Postgres, S3, the reference server and an OpenID provider
        run: |
          docker run -d --name pg -p 127.0.0.1:15432:5432 -e POSTGRES_PASSWORD=test postgres:18.6-alpine
          docker run -d --name s3 -p 127.0.0.1:18333:8333 chrislusf/seaweedfs:4.48 server -s3
          docker run -d --name ref -p 127.0.0.1:18042:8042 \
            -e DICOM_WEB_PLUGIN_ENABLED=true -e ORTHANC__AUTHENTICATION_ENABLED=false \
            orthancteam/orthanc:26.9.1
          # LOCAL_TEST: Rauthy's own demo settings, on localhost only; its bootstrap is ours
          docker run -d --name rauthy -p 127.0.0.1:18088:8080 \
            -e LOCAL_TEST=true -e LISTEN_SCHEME=http -e PUB_URL=localhost:18088 \
            -e BOOTSTRAP_DIR=/app/bootstrap \
            -v "$PWD/crates/pacs-server/tests/rauthy/bootstrap:/app/bootstrap:ro" \
            ghcr.io/sebadob/rauthy:0.37.2
          ready() { for _ in $(seq 1 60); do "$@" && return 0; sleep 2; done; echo "::error::not ready: $*"; return 1; }
          ready docker exec pg pg_isready -U postgres -q
          ready curl -fsS -o /dev/null http://127.0.0.1:18042/system
          ready curl -fsS -o /dev/null http://localhost:18088/auth/v1/.well-known/openid-configuration
          # the bucket the S3 tests use
          ready curl -fsS -o /dev/null -X PUT http://127.0.0.1:18333/pacs-test

      # for PACS_INDEX_TLS: its certificate and authority are made by the script
      - name: A Postgres that speaks TLS
        run: scripts/postgres-tls.sh "$RUNNER_TEMP/pg-tls" 15433 postgres:18.6-alpine >> "$GITHUB_ENV"

      - name: DCMTK and pynetdicom (DIMSE interoperability), xmllint (audit schema)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dcmtk libxml2-utils
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q pynetdicom
          echo "PACS_TEST_PYTHON=$RUNNER_TEMP/py/bin/python" >> "$GITHUB_ENV"

      - run: cargo test --workspace --locked
      - run: cargo test -p pacs-dimse --test interop --locked -- --ignored

      # docs/backup.md as written: a running server backed up, restored, and checked
      - name: Backup and restore
        env:
          PACS_TEST_PG_CONTAINER: pg
          PACS_TEST_PG_URL: postgres://postgres:test@127.0.0.1:15432
          PACS_TEST_S3_ENDPOINT: http://127.0.0.1:18333
        run: |
          cargo build -p pacs-server --locked
          scripts/backup-restore.sh sqlite
          scripts/backup-restore.sh postgres

      - name: Container logs
        if: failure()
        run: for c in pg pacs-pg-tls s3 ref rauthy; do echo "== $c"; docker logs --tail 50 "$c"; done

  test-windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

