# The site, https://aegyptiacus11.github.io/pacs-rs/: the homepage in site/, and under /docs/
# the mdBook of docs/ (book.toml), put together by scripts/build-site.py. A pull request checks the links, builds the book and runs the pages' examples
# against a server (crates/pacs-server/tests/docs.rs); a push to main also publishes the book
# to GitHub Pages, once both have passed. GitHub's own runners only, like ci.yml.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - site/**
      - book.toml
      - README.md
      - scripts/check-doc-links.py
      - scripts/test_check_doc_links.py
      - scripts/build-site.py
      - scripts/test_build_site.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - site/**
      - book.toml
      - README.md
      - scripts/check-doc-links.py
      - scripts/test_check_doc_links.py
      - scripts/build-site.py
      - scripts/test_build_site.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: "0.5.4"
  # of mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz, from the release's own digest
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tests of the link checker and of the site build
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Links
        run: python3 scripts/check-doc-links.py
      - name: mdBook
        run: |
          set -euo pipefail
          archive="mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/$archive"
          echo "$MDBOOK_SHA256  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mdbook"
          tar -xzf "$archive" -C "$RUNNER_TEMP/mdbook"
          rm "$archive"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - name: Build the site
        run: |
          set -euo pipefail
          python3 scripts/build-site.py
          test -s target/site/index.html
          test -s target/site/docs/index.html
          test -s target/site/docs/quickstart.html
          # the old address of a page of the book, and the sample study the quickstart downloads
          grep -q 'url=docs/roadmap.html' target/site/roadmap.html
          test -s target/site/sample/00001.dcm
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: target/site

  # ci.yml runs this test with the others when the code changes, but not when only docs/ does
  examples:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The pages' examples, against a server
        run: cargo test -p pacs-server --test docs --locked
      - name: The API reference is what the handlers say
        run: cargo test -p pacs-server --test api_reference --locked

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, examples]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
