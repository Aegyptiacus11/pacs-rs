# The site, https://aegyptiacus11.github.io/pacs-rs/: the homepage in site/, and under /docs/
# the pages of docs/ built by Starlight (docs-site/), put together by scripts/build-site.py. A pull request checks the links, builds the book and runs the pages' examples
# against a server (crates/pacs-server/tests/docs.rs); a push to main also publishes the book
# to GitHub Pages, once both have passed. GitHub's own runners only, like ci.yml.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - site/**
      - docs-site/**
      - README.md
      - scripts/check-doc-links.py
      - scripts/test_check_doc_links.py
      - scripts/build-site.py
      - scripts/test_build_site.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - site/**
      - docs-site/**
      - README.md
      - scripts/check-doc-links.py
      - scripts/test_check_doc_links.py
      - scripts/build-site.py
      - scripts/test_build_site.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tests of the link checker, of the site build and of the sample's converter
        run: |
          set -euo pipefail
          # the converter reads NIfTI and writes DICOM: its tests need both libraries
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet nibabel==5.3.2 pydicom==3.0.1
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s scripts -p 'test_*.py'
      - name: Links
        run: python3 scripts/check-doc-links.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: The documentation's builder (docs-site/package-lock.json)
        working-directory: docs-site
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
      - name: Build the site
        run: |
          set -euo pipefail
          python3 scripts/build-site.py
          test -s target/site/index.html
          test -s target/site/docs/index.html
          test -s target/site/docs/quickstart.html
          # the old address of a page of the book, and the sample study the quickstart downloads
          grep -q 'url=docs/roadmap.html' target/site/roadmap.html
          test -s target/site/sample/00001.dcm
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: target/site

  # ci.yml runs this test with the others when the code changes, but not when only docs/ does
  examples:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The pages' examples, against a server
        run: cargo test -p pacs-server --test docs --locked
      - name: The API reference is what the handlers say
        run: cargo test -p pacs-server --test api_reference --locked
      - name: The settings page has every setting, with its default
        run: cargo test -p pacs-server --test settings_page --locked

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, examples]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
