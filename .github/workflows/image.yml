# Builds the pacs-server image when a tag v<version> is pushed, pushes it to Harbor on the
# homeserver as pacs/pacs-server:<version>-<short commit>, pins it by digest in
# homeserver-infra's stacks/pacs/compose.yml and redeploys that stack through its Portainer
# webhook. Runs on the homeserver's own runner (homeserver-infra, stacks/runners), whose build
# daemon reaches Harbor at homeserver:8080.
# The runner must go before this repo is made public (see README, "Releases").
name: image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}

jobs:
  image:
    runs-on: [self-hosted, homeserver]
    timeout-minutes: 60
    env:
      REGISTRY: homeserver:8080
      IMAGE: homeserver:8080/pacs/pacs-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Docker's login lives in the job's temporary folder, emptied before the next job.
      # (The runner context is not available in the job's env, hence this step.)
      - name: Docker config
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - name: Tag
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $crate"
            exit 1
          fi
          echo "tag=$version-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: printf '%s' "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u "$HARBOR_USERNAME" --password-stdin

      # Tags are never overwritten: builds are not byte-identical, so a re-run would push a
      # different image under the same tag. A re-run takes the image already there.
      - name: Already pushed?
        id: existing
        run: |
          if docker pull --quiet "$IMAGE:${{ steps.tag.outputs.tag }}"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.existing.outputs.found != 'true'
        run: >
          docker build --pull
          --label org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          -t "$IMAGE:${{ steps.tag.outputs.tag }}" .

      - name: Push
        if: steps.existing.outputs.found != 'true'
        run: docker push "$IMAGE:${{ steps.tag.outputs.tag }}"

      - name: Digest
        id: push
        run: |
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ steps.tag.outputs.tag }}")"
          echo "$digest"
          echo "image=127.0.0.1:8080/pacs/pacs-server:${{ steps.tag.outputs.tag }}@${digest#*@}" >> "$GITHUB_OUTPUT"
          {
            echo "Image \`$IMAGE:${{ steps.tag.outputs.tag }}\`"
            echo
            echo "On the homeserver: \`127.0.0.1:8080/pacs/pacs-server:${{ steps.tag.outputs.tag }}@${digest#*@}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout "$REGISTRY" || true

      # The stack is deployed from homeserver-infra, so the new image goes there first;
      # a redeploy from Portainer would otherwise bring the old one back.
      - name: Pin in homeserver-infra
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_TOKEN }}
          NEW_IMAGE: ${{ steps.push.outputs.image }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$INFRA_TOKEN" | base64 -w0)"
          git() { command git -c "http.https://github.com/.extraheader=$auth" "$@"; }
          dir="$RUNNER_TEMP/homeserver-infra"
          git clone --quiet --depth 1 https://github.com/Aegyptiacus11/homeserver-infra.git "$dir"
          cd "$dir"
          sed -i "s#^\(    image: \)127\.0\.0\.1:8080/pacs/pacs-server:.*#\1$NEW_IMAGE#" stacks/pacs/compose.yml
          grep -qF "image: $NEW_IMAGE" stacks/pacs/compose.yml || { echo "::error::no pacs-server image line in stacks/pacs/compose.yml"; exit 1; }
          if git diff --quiet; then
            echo "Already pinned to $NEW_IMAGE"
            exit 0
          fi
          git -c user.name="pacs-rs image workflow" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -am "pacs: ${{ steps.tag.outputs.tag }}, from pacs-rs $GITHUB_REF_NAME"
          for _ in 1 2 3; do
            git push --quiet origin HEAD:main && exit 0
            git pull --quiet --rebase --depth 1 origin main
          done
          echo "::error::could not push to homeserver-infra"
          exit 1

      - name: Redeploy
        env:
          WEBHOOK: ${{ secrets.PORTAINER_PACS_WEBHOOK }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "::error::secret PORTAINER_PACS_WEBHOOK is empty"; exit 1; }
          # Portainer's self-signed certificate, on the host itself.
          code="$(curl -sS -k -o /dev/null -w '%{http_code}' -X POST --max-time 300 "https://homeserver:9443/api/stacks/webhooks/$WEBHOOK")"
          case "$code" in
            2??) ;;
            404) echo "::error::Portainer does not know this webhook: set PORTAINER_PACS_WEBHOOK again from the pacs stack's page"; exit 1 ;;
            *) echo "::error::webhook answered HTTP $code"; exit 1 ;;
          esac
          for _ in $(seq 1 36); do
            if curl -fsS --max-time 5 http://100.116.202.2:8104/healthz >/dev/null; then
              echo "pacs answers on its tailnet port"
              echo "Deployed \`${{ steps.push.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::pacs did not come back healthy within 3 minutes"
          exit 1
