# Publishes a release when a tag v<version> is pushed (the workspace version in Cargo.toml):
# - binaries: Linux x86_64 and aarch64 (static musl, the same ones as in the image) and
#   Windows x86_64 (static CRT, no runtime to install), each with the licences and README;
# - the image ghcr.io/aegyptiacus11/pacs-server:<version> for linux/amd64 and linux/arm64,
#   and :latest when this is the highest release (pre-releases like v1.0.0-rc1 never get it);
# - a GitHub release with those files, SHA256SUMS and generated notes.
# Nothing is published unless every build succeeded.
# Run by hand (Actions -> release -> Run workflow), it is a dry run: everything is built and
# smoke-tested at the workspace version, nothing is pushed or published.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/aegyptiacus11/pacs-server

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      push: ${{ steps.v.outputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          crate="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            version="$crate"
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dry run: builds $crate, publishes nothing"
          fi
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $crate"
            exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  # One native runner per architecture: building Rust under emulation takes hours.
  linux:
    needs: version
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux/amd64, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Builder
        run: docker buildx create --use --name release

      - name: Log in to ghcr.io
        if: needs.version.outputs.push == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Pushed by digest only; the "image" job ties both architectures to the version tag.
      - name: Image
        run: |
          docker buildx build --platform "${{ matrix.platform }}" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.licenses="MIT OR Apache-2.0" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=${{ needs.version.outputs.push }}" \
            --metadata-file "$RUNNER_TEMP/meta.json" .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
          case "$digest" in sha256:*) ;; *) echo "::error::no digest in the build metadata"; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      # The same build again (all layers cached), exported as files to take the binary out.
      - name: Binary
        run: |
          docker buildx build --platform "${{ matrix.platform }}" --output "type=local,dest=$RUNNER_TEMP/rootfs" .
          bin="$RUNNER_TEMP/rootfs/pacs-server"
          [ -x "$bin" ] || { echo "::error::no pacs-server in the image"; exit 1; }
          file "$bin" | grep -qE "static(-pie)? linked" || { file "$bin"; echo "::error::binary is not static"; exit 1; }
          name="pacs-server-$VERSION-linux-${{ matrix.arch }}"
          mkdir -p "$RUNNER_TEMP/$name" dist
          cp "$bin" LICENSE-MIT LICENSE-APACHE README.md "$RUNNER_TEMP/$name/"
          tar -C "$RUNNER_TEMP" -czf "dist/$name.tar.gz" "$name"

      - name: Smoke test
        run: |
          "$RUNNER_TEMP/rootfs/pacs-server" --version
          "$RUNNER_TEMP/rootfs/pacs-server" --help >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Static C runtime: the .exe runs without the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Web interface
        working-directory: ui
        run: npm ci --no-audit --no-fund && npm run build
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --release --locked -p pacs-server
      - name: Smoke test
        run: |
          target/release/pacs-server.exe --version
          target/release/pacs-server.exe --help >/dev/null
      - name: Package
        run: |
          name="pacs-server-$VERSION-windows-x86_64"
          mkdir -p "$name" dist
          cp target/release/pacs-server.exe LICENSE-MIT LICENSE-APACHE README.md "$name/"
          7z a -tzip -bso0 "dist/$name.zip" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows-x86_64
          path: dist/
          if-no-files-found: error

  image:
    needs: [version, linux, windows]
    if: needs.version.outputs.push == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Tag both architectures
        run: |
          refs=()
          for f in "$RUNNER_TEMP"/digests/*; do refs+=("$IMAGE@sha256:$(basename "$f")"); done
          [ "${#refs[@]}" -eq 2 ] || { echo "::error::expected 2 digests, got ${#refs[@]}"; exit 1; }
          tags=(-t "$IMAGE:$VERSION")
          # latest follows the highest release, so a fix for an older line does not move it back
          newest="$(git ls-remote --tags --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" 'v*' | sed 's#.*refs/tags/##' | grep -vF -e - | sort -V | tail -n1)"
          [ -n "$newest" ] || { echo "::error::could not list the repository's tags"; exit 1; }
          if [ "$PRERELEASE" = false ] && [ "$newest" = "$GITHUB_REF_NAME" ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  publish:
    needs: [version, image]
    if: needs.version.outputs.push == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Release
        working-directory: dist
        run: |
          n="$(find . -maxdepth 1 -type f | wc -l)"
          [ "$n" -eq 3 ] || { echo "::error::expected 3 archives, got $n"; ls -l; exit 1; }
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          notes="Docker image: \`docker pull $IMAGE:$VERSION\` (linux/amd64, linux/arm64)."
          pre=()
          [ "$PRERELEASE" = true ] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "pacs-rs $VERSION" --notes "$notes" --generate-notes "${pre[@]}" -- *
