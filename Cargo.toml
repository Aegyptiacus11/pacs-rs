[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aegyptiacus11/pacs-rs"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dicom-core = "0.10.0"
dicom-dictionary-std = "0.10.0"
dicom-json = "0.10.0"
dicom-object = "0.10.0"
futures = "0.3.34"
http-body-util = "0.1.5"
memchr = "2.8.3"
object_store = { version = "0.14.2", features = ["aws"] }
pacs-archive = { path = "crates/pacs-archive" }
pacs-core = { path = "crates/pacs-core" }
pacs-dicomweb = { path = "crates/pacs-dicomweb" }
pacs-index = { path = "crates/pacs-index" }
pacs-server = { path = "crates/pacs-server" }
pacs-store = { path = "crates/pacs-store" }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
