[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aegyptiacus11/pacs-rs"

[workspace.dependencies]
dicom-core = "0.10.0"
dicom-dictionary-std = "0.10.0"
dicom-json = "0.10.0"
dicom-object = "0.10.0"
serde_json = "1.0.154"
thiserror = "2.0.21"
