[workspace]
resolver = "3"
# named one by one, not "crates/*": deps.rs, which the README's badge asks, skips glob members
members = [
    "crates/pacs-archive",
    "crates/pacs-audit",
    "crates/pacs-core",
    "crates/pacs-deid",
    "crates/pacs-dicomweb",
    "crates/pacs-dimse",
    "crates/pacs-index",
    "crates/pacs-rest",
    "crates/pacs-server",
    "crates/pacs-store",
]

[workspace.package]
version = "0.16.2"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aegyptiacus11/pacs-rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Keep target/ small: our crates get file and line numbers in backtraces, dependencies get no
# debug info. Full debug info for 400+ crates filled target/ with over 100 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
