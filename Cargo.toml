[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aegyptiacus11/pacs-rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Keep target/ small: our crates get file and line numbers in backtraces, dependencies get no
# debug info. Full debug info for 400+ crates filled target/ with over 100 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
