[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aegyptiacus11/pacs-rs"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
# CharLS (JPEG-LS), C++ built by cmake and linked statically.
charls = { version = "0.4.2", features = ["static"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dicom-core = "0.10.0"
dicom-dictionary-std = "0.10.0"
dicom-encoding = "0.10.1"
dicom-json = "0.10.0"
dicom-object = "0.10.0"
dicom-transfer-syntax-registry = { version = "0.10.1", default-features = false }
# async, so the association tasks share tokio with the HTTP server; async-tls for step 6
# of docs/interop.md.
dicom-ul = { version = "0.10.1", features = ["async", "async-tls"] }
futures = "0.3.34"
http-body-util = "0.1.5"
# jxl-rs, the libjxl project's JPEG XL decoder.
jxl = "0.8.0"
memchr = "2.8.3"
mimalloc = { version = "0.1.52", default-features = false }
object_store = { version = "0.14.2", features = ["aws"] }
pacs-archive = { path = "crates/pacs-archive" }
pacs-core = { path = "crates/pacs-core" }
pacs-dicomweb = { path = "crates/pacs-dicomweb" }
pacs-dimse = { path = "crates/pacs-dimse" }
pacs-index = { path = "crates/pacs-index" }
pacs-rest = { path = "crates/pacs-rest" }
pacs-server = { path = "crates/pacs-server" }
pacs-store = { path = "crates/pacs-store" }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["any", "macros", "migrate", "postgres", "runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zune-core = { version = "0.5.3", default-features = false, features = ["std"] }
zune-jpegxl = { version = "0.5.2", default-features = false, features = ["std"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Small and fast: one codegen unit with LTO, no symbols. Panics still unwind, so one failing
# request cannot take the server down.
[profile.release]
lto = true
codegen-units = 1
strip = true
