[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aegyptiacus11/pacs-rs"

[workspace.dependencies]
bytes = "1.12.1"
dicom-core = "0.10.0"
dicom-dictionary-std = "0.10.0"
dicom-json = "0.10.0"
dicom-object = "0.10.0"
pacs-core = { path = "crates/pacs-core" }
object_store = { version = "0.14.2", features = ["aws"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
