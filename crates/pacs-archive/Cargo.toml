[package]
name = "pacs-archive"
description = "The pacs-rs archive: files in the store, entries in the index, kept in step"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dicom-dictionary-std = "0.10.0"
bytes = "1.12.1"
pacs-core = { path = "../pacs-core" }
pacs-index = { path = "../pacs-index" }
pacs-store = { path = "../pacs-store" }
# each stored file's SHA-256, kept in the index and checked against the store
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "rt", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
dicom-dictionary-std = "0.10.0"
pacs-core = { path = "../pacs-core", features = ["real"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "rt"] }
