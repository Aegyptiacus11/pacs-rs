[package]
name = "pacs-core"
description = "DICOM instances as pacs-rs stores and indexes them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# JPEG-LS in safe Rust, no dependencies: it writes the bytes CharLS writes (its tests check)
codecsls = "0.1.0"
dicom-core = "0.10.0"
dicom-dictionary-std = "0.10.0"
dicom-json = "0.10.0"
dicom-object = "0.10.0"
dicom-transfer-syntax-registry = { version = "0.10.1", default-features = false, optional = true }
jpeg-encoder = "0.7.1"
# jxl-rs, the libjxl project's JPEG XL decoder.
jxl = "0.8.0"
memchr = "2.8.3"
png = "0.18.1"
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
zune-core = { version = "0.5.3", default-features = false, features = ["std"] }
zune-jpegxl = { version = "0.5.2", default-features = false, features = ["std"] }

[features]
# Real DICOM files (tests/data/pydicom), whole and altered, as test data for the tests here
# and in the other crates.
real = ["dep:dicom-transfer-syntax-registry"]

[dev-dependencies]
dicom-dictionary-std = "0.10.0"
pacs-core = { path = ".", features = ["real"] }

[[example]]
name = "write_real"
required-features = ["real"]

[[example]]
name = "write_altered"
required-features = ["real"]
