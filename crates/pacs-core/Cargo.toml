[package]
name = "pacs-core"
description = "DICOM instances as pacs-rs stores and indexes them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
charls.workspace = true
dicom-core.workspace = true
dicom-dictionary-std.workspace = true
dicom-json.workspace = true
dicom-object.workspace = true
jxl.workspace = true
memchr.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
zune-core.workspace = true
zune-jpegxl.workspace = true

[features]
# Synthetic CT series for tests here and in the other crates.
synthetic = []

[dev-dependencies]
dicom-dictionary-std.workspace = true
pacs-core = { path = ".", features = ["synthetic"] }

[[example]]
name = "write_synthetic"
required-features = ["synthetic"]

[[example]]
name = "write_un_vr"
required-features = ["synthetic"]
