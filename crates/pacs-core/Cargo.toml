[package]
name = "pacs-core"
description = "DICOM instances as pacs-rs stores and indexes them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
charls.workspace = true
dicom-core.workspace = true
dicom-dictionary-std.workspace = true
dicom-json.workspace = true
dicom-object.workspace = true
dicom-transfer-syntax-registry = { workspace = true, optional = true }
jxl.workspace = true
memchr.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
zune-core.workspace = true
zune-jpegxl.workspace = true

[features]
# Real DICOM files (tests/data/pydicom), whole and altered, as test data for the tests here
# and in the other crates.
real = ["dep:dicom-transfer-syntax-registry"]

[dev-dependencies]
dicom-dictionary-std.workspace = true
pacs-core = { path = ".", features = ["real"] }
