[package]
name = "pacs-dicomweb"
description = "DICOMweb for pacs-rs: QIDO-RS, WADO-RS and STOW-RS over axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# the description of the HTTP API, written beside each handler
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
axum = "0.8.9"
bytes = "1.12.1"
futures = "0.3.34"
memchr = "2.8.3"
pacs-archive = { path = "../pacs-archive" }
pacs-core = { path = "../pacs-core" }
pacs-index = { path = "../pacs-index" }
pacs-store = { path = "../pacs-store" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
http-body-util = "0.1.5"
pacs-core = { path = "../pacs-core", features = ["real"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
