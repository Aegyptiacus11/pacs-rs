[package]
name = "pacs-dimse"
description = "DIMSE for pacs-rs: C-ECHO, C-STORE, C-FIND and C-MOVE over the DICOM Upper Layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.1"
# the command-line tools only (feature `tools`)
clap = { version = "4.6.7", features = ["derive"], optional = true }
dicom-dictionary-std = "0.10.0"
dicom-encoding = "0.10.1"
dicom-object = "0.10.0"
dicom-core = "0.10.0"
dicom-json = "0.10.0"
dicom-transfer-syntax-registry = { version = "0.10.1", default-features = false }
# async, so the association tasks share tokio with the HTTP server; async-tls for step 6
# of docs/interop.md.
dicom-ul = { version = "0.10.1", features = ["async", "async-tls"] }
pacs-archive = { path = "../pacs-archive" }
pacs-deid = { path = "../pacs-deid" }
pacs-index = { path = "../pacs-index" }
pacs-store = { path = "../pacs-store" }
# TLS on DIMSE (PS3.15 B.12): the library dicom-ul speaks TLS with, and ring as its
# cryptography, named explicitly since the build holds two
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2.0.21"
pacs-core = { path = "../pacs-core" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time", "rt", "sync"] }
tracing = "0.1.44"
# a large C-STORE's data set written to disk as it arrives (Config::spool)
tempfile = "3.27.0"

[features]
# storescu, storescp, findscu, movescu, getscu and echoscu, for sites without DCMTK
tools = ["dep:clap"]

[[bin]]
name = "echoscu"
path = "src/bin/echoscu.rs"
required-features = ["tools"]

[[bin]]
name = "storescu"
path = "src/bin/storescu.rs"
required-features = ["tools"]

[[bin]]
name = "storescp"
path = "src/bin/storescp.rs"
required-features = ["tools"]

[[bin]]
name = "findscu"
path = "src/bin/findscu.rs"
required-features = ["tools"]

[[bin]]
name = "movescu"
path = "src/bin/movescu.rs"
required-features = ["tools"]

[[bin]]
name = "getscu"
path = "src/bin/getscu.rs"
required-features = ["tools"]

[[test]]
name = "tools"
required-features = ["tools"]

[dev-dependencies]
pacs-core = { path = "../pacs-core", features = ["real"] }
tempfile = "3.27.0"
