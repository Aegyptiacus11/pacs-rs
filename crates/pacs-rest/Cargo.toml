[package]
name = "pacs-rest"
description = "The pacs-rs REST API: patients, studies, series and instances by public ID"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
futures = "0.3.34"
pacs-archive = { path = "../pacs-archive" }
pacs-core = { path = "../pacs-core" }
pacs-index = { path = "../pacs-index" }
pacs-store = { path = "../pacs-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
# the description of the HTTP API, written beside each handler
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
bytes = "1.12.1"
dicom-dictionary-std = "0.10.0"
http-body-util = "0.1.5"
pacs-core = { path = "../pacs-core", features = ["real"] }
tower = { version = "0.5.3", features = ["util"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
