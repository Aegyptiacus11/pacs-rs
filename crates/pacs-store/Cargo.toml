[package]
name = "pacs-store"
description = "Where pacs-rs keeps DICOM files: local disk or S3-compatible object storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.1"
futures = "0.3.34"
object_store = { version = "0.14.2", features = ["aws"] }
pacs-core = { path = "../pacs-core" }
thiserror = "2.0.21"

[dev-dependencies]
pacs-core = { path = "../pacs-core", features = ["real"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
